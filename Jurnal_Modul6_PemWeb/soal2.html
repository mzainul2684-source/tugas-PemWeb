<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain dengan Warna</title>
    <link rel="stylesheet" href="style2.css">
    <!-- IMPORT CDN DISINI -->
    <script  src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Bermain dengan Warna</h1>

    <div>
        <button id="tombolUngu">Ungu</button>
        <button id="tombolBiru">Biru</button>
        <button id="tombolHijau">Hijau</button>
    </div>

    <div id="kotakWarna"></div>

    <div>
        <button id="sembunyikanKotak">Sembunyikan Kotak</button>
        <button id="tampilkanKotak">Tampilkan Kotak</button>
    </div>

    <p>Klik tombol warna untuk mengubah warna kotak.</p>
    <p>Gunakan tombol Sembunyikan dan Tampilkan untuk menyembunyikan dan menampilkan kotak.</p>

	<script>
        $(document).ready(function() {
        // Mengubah warna kotak menjadi ungu.
        $("#tombolUngu").on("click", function() {
            $("#kotakWarna").css("background-color", "#7c3aed");
        });

        // Mengubah warna kotak menjadi biru.
        $("#tombolBiru").on("click", function() {
            $("#kotakWarna").css("background-color", "#2563eb");
        });

        // Mengubah warna kotak menjadi hijau.
        $("#tombolHijau").on("click", function() {
            $("#kotakWarna").css("background-color", "#15803d");
        });

        // Menyembunyikan kotak.
        $("#sembunyikanKotak").on("click", function() {
            $("#kotakWarna").hide();
        });

        // Menampilkan kembali kotak.
        $("#tampilkanKotak").on("click", function() {
            $("#kotakWarna").show();
        });
        });
    </script>
</body>
</html>

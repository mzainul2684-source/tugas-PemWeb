<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM_Soal1</title>
    <link type="text/css" rel="stylesheet" href="style1.css">
</head>
<body onload="isiData()">
    <form>
        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>

        <div class="form-group">
            <label for="nim">NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script>
        function isiData() {
            // Meminta input pengguna ketika halaman selesai dimuat.
            const nama = prompt("Masukkan nama kamu:");
            const nim = prompt("Masukkan nim kamu:");

            // Menampilkan input pada formulir.
            // Jika pengguna menekan Cancel, kolom dibiarkan kosong.
            document.getElementById("nama").value =
                nama === null ? "" : nama;

            document.getElementById("nim").value =
                nim === null ? "" : nim;
        }
    </script>
</body>
</html>

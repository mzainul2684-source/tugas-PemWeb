
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Baca</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid px-4">

            <!-- Nama website -->
            <a class="navbar-brand fw-bold" href="#">
                Ruang Baca
            </a>

            <!-- Tombol menu untuk layar HP -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavbar"
                aria-controls="menuNavbar"
                aria-expanded="false"
                aria-label="Buka menu navigasi"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu navigasi -->
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Tentang
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Bantuan
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Bagian utama -->
    <main class="bg-light flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">

                <!-- Grid responsif untuk form -->
                <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                    <!-- Card login -->
                    <div class="card shadow border-0">

                        <div class="card-body p-4">

                            <!-- Judul -->
                            <h1 class="h5 text-center mb-1">
                                Masuk ke Ruang Baca
                            </h1>

                            <p class="text-center text-secondary small mb-4">
                                Temukan bacaan untuk hari ini.
                            </p>

                            <!-- Form login -->
                            <form>

                                <!-- Input username -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        Username
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="username"
                                        placeholder="Masukkan username"
                                        autocomplete="username"
                                    >
                                </div>

                                <!-- Input password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Masukkan password"
                                        autocomplete="current-password"
                                    >
                                </div>

                                <!-- Checkbox ingat saya -->
                                <div class="form-check mb-3">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="ingatSaya"
                                    >

                                    <label class="form-check-label" for="ingatSaya">
                                        Ingat saya
                                    </label>
                                </div>

                                <!-- Tombol masuk -->
                                <button type="button" class="btn btn-success w-100">
                                    Masuk
                                </button>

                            </form>
                        </div>

                        <!-- Footer card -->
                        <div class="card-footer text-center py-3">
                            <a href="#" class="link-success small">
                                Lupa password?
                            </a>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

</body>
</html>
